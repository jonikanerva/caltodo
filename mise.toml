# Source of truth for the toolchain and the command surface (STACK.md §1 and
# §3). The Rust version comes only from rust-toolchain.toml. Update the
# mirrors in the same commit: `.nvmrc`, `engines` and `packageManager` in the
# root package.json, and `packages` in railpack.json.
#
# A fresh machine: install mise, rustup, and the Apple container tool, then
# run `mise trust` and `mise run setup` in the repository root.
[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
node = "26.13.1"
pnpm = "12.21.0"
gitleaks = "8.30.1"
# Release binary; mise checks the SHA-256 of the aqua registry.
cargo-deny = "0.20.2"
# Release binary; mise checks the SHA-256 of the aqua registry.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.152"
# Release binary; mise checks the GitHub asset digest and the GitHub artifact
# attestation. The project publishes no checksum file.
"github:Boshen/cargo-shear" = "1.14.1"
# Built from crates.io with the locked dependency versions of the release.
"cargo:sqlx-cli" = { version = "0.9.0", default-features = false, features = "postgres,rustls", locked = true }

# The local PostgreSQL servers run in Apple `container` (STACK.md §1, ADR
# 0006 and 0007). scripts/db.sh owns their lifecycle: one development
# container and volume per checkout, and one temporary container per test
# run. The image has the same PostgreSQL major version as production
# (STACK.md §15); the major version also names the development volume. The
# digest pins the multi-platform image index; the tag is for people. Change
# the version only here.
[env]
CALTODO_PG_IMAGE = "docker.io/library/postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc"

[tasks.setup]
description = "Install the pinned tools, the locked dependencies, and the Playwright browser"
run = [
  "mise install",
  "pnpm install --frozen-lockfile",
  "cargo fetch --locked",
  # The container tool and the linux/arm64 PostgreSQL image.
  "scripts/db.sh setup",
  # The browser build matches the locked Playwright version of e2e/.
  "pnpm --filter @caltodo/e2e exec playwright install chromium",
]

# `dev`, `db:migrate`, `test`, `test:e2e`, `sqlx:*`, and `verify` start and
# stop their servers themselves. The other db: tasks are optional tools.
[tasks."db:start"]
description = "Keep the development PostgreSQL of this checkout running until db:stop"
run = "scripts/db.sh start"

[tasks."db:stop"]
description = "Stop the development PostgreSQL of this checkout; the data stays in its volume"
run = "scripts/db.sh stop"

[tasks."db:info"]
description = "Show the PostgreSQL servers of this checkout"
run = "scripts/db.sh info"

[tasks."db:psql"]
description = "psql on the development database (arguments go to psql)"
raw = true
run = "scripts/db.sh psql"

[tasks."db:dump"]
description = "Write the development database to a pg_dump archive: mise run db:dump -- FILE"
run = "scripts/db.sh dump"

[tasks."db:restore"]
description = "Replace the development database with a pg_dump archive; the old one goes to .tmp/db/backups: mise run db:restore -- FILE"
run = "scripts/db.sh restore"

[tasks."db:clone"]
description = "Replace the development database with the one of another checkout; the old one goes to .tmp/db/backups: mise run db:clone -- DIR"
run = "scripts/db.sh clone"

[tasks."db:reset"]
description = "Replace the development database with an empty one; the old one goes to .tmp/db/backups"
run = "scripts/db.sh reset"

[tasks."db:gc"]
description = "Run the database clean-up now, and remove the kept test containers of this checkout"
run = "scripts/db.sh gc"

[tasks."db:migrate"]
description = "Apply the migrations to the development database"
run = "scripts/db.sh with-dev-db -- cargo run --locked -p caltodo -- migrate"

[tasks.dev]
description = "The server on port 5001 and the Vite dev server on port 5000; reads .env"
raw = true
run = "scripts/db.sh with-dev-db -- scripts/dev-run"

[tasks.format]
description = "Format the Rust and the TypeScript sources"
run = [
  "cargo fmt --all",
  "pnpm exec prettier --write . --log-level warn",
]

[tasks.format-check]
description = "Fail on a formatting difference; change no file"
run = [
  "cargo fmt --all -- --check",
  "pnpm exec prettier --check . --log-level warn",
]

[tasks.lint]
description = "Clippy, type-aware Oxlint, and the type check of every TypeScript package"
run = [
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "pnpm exec oxlint --type-aware --deny-warnings web/src packages/api-client/src packages/api-client/scripts e2e",
  # pnpm runs the packages in dependency order: the API client first.
  "pnpm --recursive --if-present run typecheck",
  # One rustls crypto provider (STACK.md §7). With two providers, rustls has
  # no process default and panics when SQLx builds a certificate verifier.
  '''
set -eu
features=$(cargo tree --locked --workspace --target all --edges features --invert rustls --prefix none)
if printf '%s\n' "$features" | grep --quiet '^rustls feature "ring"' &&
  printf '%s\n' "$features" | grep --quiet '^rustls feature "aws_lc_rs"'; then
  echo "rustls has two crypto providers (ring and aws-lc-rs); keep one (STACK.md §7)" >&2
  exit 1
fi
''',
]

[tasks."sqlx:check"]
description = "Fail when the SQLx query metadata (.sqlx) differs from the queries and the migrations"
run = "scripts/db.sh with-test-db -- scripts/db.sh sqlx check"

[tasks."sqlx:prepare"]
description = "Write the SQLx query metadata (.sqlx) from a freshly migrated database"
run = "scripts/db.sh with-test-db -- scripts/db.sh sqlx prepare"

[tasks."contract:export"]
description = "Write contract/openapi.json from the Rust HTTP types"
# Another task can read the document at the same time, so the export goes to
# a temporary file and replaces the document only when it changed.
run = '''
set -eu
temporary="contract/openapi.json.$$.tmp"
trap 'rm -f "$temporary"' EXIT
cargo run --locked --quiet -p caltodo --bin openapi -- "$temporary"
if cmp -s "$temporary" contract/openapi.json; then exit 0; fi
mv "$temporary" contract/openapi.json
'''

[tasks."contract:generate"]
description = "Generate the TypeScript API client from contract/openapi.json"
run = "pnpm --filter @caltodo/api-client run generate"

[tasks."contract:check"]
description = "Fail when the OpenAPI document or the generated client drifts; change no file"
run = "pnpm --filter @caltodo/api-client run contract-check"

[tasks."scan:secrets"]
description = "Gitleaks on the history that HEAD reaches"
run = 'gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="--full-history HEAD" .'

[tasks."scan:deps"]
description = "pnpm audit, cargo-deny (advisories, bans, licences, sources), and cargo-shear"
run = [
  "pnpm audit --audit-level low",
  "cargo deny --locked check",
  "cargo shear --locked --deny-warnings",
]

[tasks.build]
description = "OpenAPI export, client generation, web build, and the release server"
# The steps write shared files of the checkout, so one build runs at a time
# in one checkout (STACK.md §3).
run = "scripts/checkout-lock build -- mise run build:steps"

[tasks."build:steps"]
hide = true
run = [
  "rm -rf web/build",
  { task = "contract:export" },
  { task = "contract:generate" },
  "pnpm --filter @caltodo/web run build",
  "cargo build --release --locked -p caltodo",
]

[tasks.test]
description = "Nextest, the doc tests, Vitest in every TypeScript package, and the browser journeys"
# One temporary test server for all steps: --share lets the nested test:e2e
# use it. A separate run gets its own server.
run = "scripts/db.sh with-test-db --share -- mise run test:steps"

[tasks."test:steps"]
hide = true
run = [
  # The database tests (`#[sqlx::test]` and tests/lifecycle.rs) create and
  # drop their own databases on the server of DATABASE_URL.
  "cargo nextest run --workspace --locked",
  "cargo test --doc --workspace --locked",
  # The e2e package has no `test` script, so this runs Vitest only.
  "pnpm --recursive --if-present run test",
  { task = "test:e2e" },
]

[tasks."test:e2e"]
description = "Playwright and axe journeys against the deterministic test server (STACK.md §11)"
run = "scripts/db.sh with-test-db -- scripts/e2e-run"

[tasks.verify]
description = "The full verification (VERIFY_CMD); stops at the first failed step"
# One temporary test server for all steps; a separate run gets its own.
run = "scripts/db.sh with-test-db --share -- mise run verify:steps"

[tasks."verify:steps"]
hide = true
run = [
  { task = "format-check" },
  { task = "lint" },
  { task = "sqlx:check" },
  { task = "contract:check" },
  { task = "scan:secrets" },
  { task = "scan:deps" },
  { task = "build" },
  { task = "test" },
]

[tasks.start]
description = "Start the release server that `mise run build` made"
raw = true
run = "./target/release/caltodo serve"
